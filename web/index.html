<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抖音音频提取</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei UI", system-ui, sans-serif; color: #162a24; background: #f1f5ef; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(28px, 9vw, 108px) 20px 40px; }
    main { max-width: 650px; margin: auto; }
    h1 { margin: 0 0 12px; font-size: clamp(33px, 6vw, 52px); letter-spacing: -.05em; line-height: 1.2; }
    p { margin: 0; }
    .intro { color: #47635a; line-height: 1.65; margin-bottom: 28px; }
    .card { background: #fff; border: 1px solid #d9e4dc; border-radius: 18px; padding: clamp(20px, 4vw, 34px); box-shadow: 0 8px 30px #163a2410; }
    label { display: block; font-weight: 700; margin-bottom: 10px; }
    input { width: 100%; border: 1px solid #a9beb4; border-radius: 9px; padding: 12px; font: inherit; color: inherit; }
    input:focus-visible { outline: 2px solid #13654e; outline-offset: 2px; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 15px; }
    button, .download { font: inherit; font-weight: 700; border-radius: 9px; padding: 11px 16px; cursor: pointer; text-decoration: none; }
    button[type="submit"], .download { background: #12664f; color: #fff; border: 1px solid #12664f; }
    button[type="button"] { background: #fff; color: #12664f; border: 1px solid #bad2c5; }
    button:disabled { opacity: .62; cursor: wait; }
    #status:not(:empty) { margin-top: 16px; color: #355749; line-height: 1.6; }
    #status[data-error="true"] { color: #9b2727; }
    #result { margin-top: 20px; border-top: 1px solid #d9e4dc; padding-top: 20px; }
    audio { display: block; width: 100%; margin-bottom: 14px; }
    .download { display: inline-block; }
  </style>
</head>
<body>
  <main>
    <h1>抖音音频提取</h1>
    <p class="intro">粘贴抖音分享链接，提取后可试听或下载音频。</p>
    <div class="card">
      <form id="form">
        <label for="share">抖音分享链接</label>
        <input id="share" type="url" placeholder="https://v.douyin.com/..." autocomplete="off" maxlength="2048" required>
        <div class="actions">
          <button id="submit" type="submit">提取音频</button>
          <button id="example" type="button">填入示例</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="result" aria-label="提取结果" hidden>
        <audio id="player" controls preload="metadata"></audio>
        <a id="download" class="download">下载音频</a>
      </section>
    </div>
  </main>
  <script>
    const form = document.querySelector("#form");
    const input = document.querySelector("#share");
    const submit = document.querySelector("#submit");
    const example = document.querySelector("#example");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const player = document.querySelector("#player");
    const download = document.querySelector("#download");
    let objectUrl;

    example.addEventListener("click", () => {
      input.value = "https://v.douyin.com/04O_N3oviao/";
      input.focus();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (submit.disabled) return;
      const url = input.value.trim();
      result.hidden = true;
      player.removeAttribute("src");
      player.load();
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      submit.disabled = true;
      example.disabled = true;
      input.readOnly = true;
      status.dataset.error = "false";
      status.textContent = "正在从抖音提取音频，请稍候…";
      try {
        const response = await fetch("/api/audio", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(typeof error.detail === "string" ? error.detail : "提取失败，请检查链接后重试。");
        }
        const file = await response.blob();
        if (!file.type.startsWith("audio/") || !file.size) throw new Error("没有收到可用的音频。");
        objectUrl = URL.createObjectURL(file);
        player.src = objectUrl;
        download.href = objectUrl;
        download.download = /filename="([^"]+)"/.exec(response.headers.get("Content-Disposition") || "")?.[1]
          || (file.type === "audio/mp4" ? "douyin.m4a" : "douyin.mp3");
        result.hidden = false;
        status.textContent = "提取成功";
      } catch (error) {
        status.dataset.error = "true";
        status.textContent = error.message;
      } finally {
        input.readOnly = false;
        example.disabled = false;
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
